<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>3D极速公路 · 漂移赛车</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #ui { position: absolute; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.75); padding: 12px 18px; border-radius: 14px; backdrop-filter: blur(12px); pointer-events: none; z-index: 10; border: 1px solid rgba(255,255,255,0.15); }
    #score { font-size: 1.8rem; font-weight: bold; color: #ffaa00; text-shadow: 0 0 15px #ffaa00aa; margin: 0; }
    #gear { font-size: 1.2rem; font-weight: bold; color: #ffffff; margin: 4px 0 0; text-shadow: 0 0 10px #ffffff88; transition: transform 0.15s ease; }
    .gear-shift { transform: scale(1.3); color: #ffaa00 !important; }
    #handbrake-indicator { font-size: 1rem; color: #ff5555; margin: 3px 0 0; font-weight: bold; display: none; text-shadow: 0 0 10px #ff0000; }
    #drift-indicator { font-size: 1rem; color: #ffaa00; margin: 3px 0 0; font-weight: bold; display: none; text-shadow: 0 0 15px #ffaa00; }
    #gameover-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,30,0.92); backdrop-filter: blur(18px); color: white; padding: 30px 50px; border-radius: 20px; text-align: center; display: none; z-index: 20; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    #gameover-panel h2 { font-size: 3rem; margin: 0 0 15px; color: #ff4d4d; letter-spacing: 3px; }
    #final-score { font-size: 2rem; color: #ffaa00; margin: 10px 0; }
    #restart-btn { margin-top: 25px; padding: 12px 30px; font-size: 1.3rem; font-weight: bold; background: #ffaa00; border: none; color: #111; border-radius: 50px; cursor: pointer; transition: 0.2s; letter-spacing: 2px; box-shadow: 0 0 20px #ffaa00aa; }
    #restart-btn:hover { background: #ffbb22; box-shadow: 0 0 30px #ffbb22; transform: scale(1.03); }
    .instruction { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.95); background: rgba(0,0,0,0.7); padding: 10px 28px; border-radius: 30px; font-size: 1rem; backdrop-filter: blur(8px); z-index: 10; letter-spacing: 1.5px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }
    #dashboard { position: absolute; bottom: 100px; right: 20px; width: 150px; height: 150px; z-index: 15; pointer-events: none; }
    canvas#speedCanvas { width: 100%; height: 100%; display: block; }

    /* ★ 手机触控按钮 */
    #mobile-controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; z-index: 25; gap: 12px; align-items: center; }
    .ctrl-row { display: flex; gap: 12px; align-items: center; justify-content: center; }
    .ctrl-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border: 2px solid rgba(255,255,255,0.3); color: white; font-size: 2rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .ctrl-btn:active { background: rgba(255,255,255,0.35); border-color: rgba(255,255,255,0.6); transform: scale(0.9); }
    .ctrl-btn.brake { width: 80px; height: 80px; background: rgba(255,80,80,0.25); border-color: rgba(255,100,100,0.5); }
    .ctrl-btn.brake:active { background: rgba(255,80,80,0.5); }
    .ctrl-btn.handbrake { width: 60px; height: 60px; background: rgba(255,160,0,0.3); border-color: rgba(255,180,0,0.5); font-size: 1.2rem; font-weight: bold; }
    .ctrl-btn.handbrake:active { background: rgba(255,160,0,0.6); }
    .ctrl-btn.left, .ctrl-btn.right { width: 65px; height: 65px; background: rgba(100,150,255,0.2); border-color: rgba(130,170,255,0.4); }
    .ctrl-btn.left:active, .ctrl-btn.right:active { background: rgba(100,150,255,0.5); }
    .ctrl-btn.gas { width: 85px; height: 85px; background: rgba(80,200,80,0.25); border-color: rgba(100,220,100,0.5); font-size: 2.5rem; }
    .ctrl-btn.gas:active { background: rgba(80,200,80,0.5); }

    @media (max-width: 1024px) {
      #mobile-controls { display: flex; flex-direction: column; }
      .instruction { display: none; }
      #dashboard { bottom: 180px; right: 10px; width: 120px; height: 120px; }
    }
    @media (max-width: 700px) {
      #score { font-size: 1.4rem; }
      #ui { top: 10px; left: 10px; padding: 10px 14px; }
      .ctrl-btn { width: 55px; height: 55px; font-size: 1.6rem; }
      .ctrl-btn.gas { width: 70px; height: 70px; font-size: 2rem; }
      .ctrl-btn.brake { width: 65px; height: 65px; }
      .ctrl-btn.handbrake { width: 50px; height: 50px; font-size: 1rem; }
      .ctrl-btn.left, .ctrl-btn.right { width: 50px; height: 50px; }
      #dashboard { bottom: 160px; right: 5px; width: 100px; height: 100px; }
    }
  </style>
</head>
<body>
  <div id="ui"><p id="score">🏆 0</p><p id="gear">⚙️ N 挡</p><p id="handbrake-indicator">🅱️ 手刹</p><p id="drift-indicator">💨 漂移中</p></div>
  <div id="dashboard"><canvas id="speedCanvas" width="220" height="220"></canvas></div>
  <div id="gameover-panel"><h2>游戏结束</h2><p style="font-size:1.3rem;">你的分数</p><p id="final-score">0</p><button id="restart-btn">↺ 重新出发</button></div>
  <div class="instruction">↑ 油门 | ↓ 刹车 | ← → 转向 | 空格 手刹漂移</div>

  <!-- ★ 手机触控按钮 -->
  <div id="mobile-controls">
    <div class="ctrl-row">
      <button class="ctrl-btn left" id="btn-left">◀</button>
      <button class="ctrl-btn gas" id="btn-gas">▲</button>
      <button class="ctrl-btn right" id="btn-right">▶</button>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn brake" id="btn-brake">■</button>
      <button class="ctrl-btn handbrake" id="btn-handbrake">漂移</button>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { CSS2DRenderer } from 'three/addons/renderers/CSS2DRenderer.js';

    const AC = window.AudioContext || window.webkitAudioContext;
    let audioCtx, engOsc, engGain, driftNoise, driftGain, audioOn = false;
    function initAudio() { if (audioOn) return; audioCtx = new AC(); engOsc = audioCtx.createOscillator(); engGain = audioCtx.createGain(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 60; engGain.gain.value = 0; engOsc.connect(engGain); engGain.connect(audioCtx.destination); engOsc.start(); const bs = audioCtx.sampleRate * 0.5, nb = audioCtx.createBuffer(1, bs, audioCtx.sampleRate); for (let i = 0; i < bs; i++) nb.getChannelData(0)[i] = Math.random() * 2 - 1; driftNoise = audioCtx.createBufferSource(); driftNoise.buffer = nb; driftNoise.loop = true; driftGain = audioCtx.createGain(); driftGain.gain.value = 0; driftNoise.connect(driftGain); driftGain.connect(audioCtx.destination); driftNoise.start(); audioOn = true; }
    function updateSound(s, d) { if (!audioOn) return; const gear = getGear(s); const freq = 50 + gear * 35 + s * 120; engOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.04); engGain.gain.setTargetAtTime(Math.min(0.14, s * 0.22), audioCtx.currentTime, 0.04); driftGain.gain.setTargetAtTime(d ? 0.12 : 0, audioCtx.currentTime, 0.06); }

    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a2b4a); scene.fog = new THREE.Fog(0x1a2b4a, 40, 280);
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 32, 32), new THREE.MeshBasicMaterial({ color: 0x2a3f6a, side: THREE.BackSide, fog: false })));
    (() => { const g = new THREE.BufferGeometry(), c = 900, p = new Float32Array(c * 3); for (let i = 0; i < c * 3; i += 3) { p[i] = (Math.random() - 0.5) * 900; p[i + 1] = Math.random() * 180 + 10; p[i + 2] = (Math.random() - 0.5) * 700 - 80; } g.setAttribute('position', new THREE.BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.9, fog: false }))); })();

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 600);
    const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); document.body.appendChild(renderer.domElement);
    const labelR = new CSS2DRenderer(); labelR.setSize(innerWidth, innerHeight); labelR.domElement.style.position = 'absolute'; labelR.domElement.style.top = '0'; labelR.domElement.style.left = '0'; labelR.domElement.style.pointerEvents = 'none'; document.body.appendChild(labelR.domElement);

    scene.add(new THREE.AmbientLight(0x4a5a8a));
    const dl = new THREE.DirectionalLight(0xffeedd, 1.7); dl.position.set(35, 60, 30); dl.castShadow = dl.receiveShadow = true; dl.shadow.mapSize.set(1024, 1024); dl.shadow.camera.near = 1; dl.shadow.camera.far = 250; dl.shadow.camera.left = -60; dl.shadow.camera.right = 60; dl.shadow.camera.top = 70; dl.shadow.camera.bottom = -50; scene.add(dl);
    scene.add(new THREE.PointLight(0x6688cc, 1.0).position.set(-18, 15, 40));

    const gnd = new THREE.Mesh(new THREE.PlaneGeometry(320, 600), new THREE.MeshStandardMaterial({ color: 0x3a4a3a, roughness: 0.9 })); gnd.rotation.x = -Math.PI / 2; gnd.position.set(0, -0.25, 140); gnd.receiveShadow = true; scene.add(gnd);
    const rd = new THREE.Mesh(new THREE.PlaneGeometry(16, 600), new THREE.MeshStandardMaterial({ color: 0x3a3a4a, roughness: 0.55, emissive: new THREE.Color(0x101018) })); rd.rotation.x = -Math.PI / 2; rd.position.set(0, 0, 140); rd.receiveShadow = true; scene.add(rd);
    [-7.8, 7.8].forEach(x => { const l = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 600), new THREE.MeshStandardMaterial({ color: 0xdddddd })); l.rotation.x = -Math.PI / 2; l.position.set(x, 0.02, 140); l.receiveShadow = true; scene.add(l); });

    const roadLines = [];
    for (let i = 0; i < 60; i++) { const r = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.05, 3.0), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: new THREE.Color(0x444444) })); r.position.set(0, 0.03, i * 10); r.receiveShadow = true; scene.add(r); roadLines.push(r); }

    const trees = [];
    function mkTree(x, z) { const g = new THREE.Group(); const th = 4.0 + Math.random() * 3.5; const t = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.65, th, 8), new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.8 })); t.position.y = th / 2; t.castShadow = t.receiveShadow = true; g.add(t); for (let l = 0; l < 3 + Math.floor(Math.random() * 3); l++) { const fr = 1.4 + Math.random() * 2.0, s = 0.12 + Math.random() * 0.38; const f = new THREE.Mesh(new THREE.SphereGeometry(fr, 8, 6), new THREE.MeshStandardMaterial({ color: new THREE.Color(0.06 + s, 0.26 + s, 0.03 + s), roughness: 0.55 })); f.position.set((Math.random() - 0.5) * 1.0, th - 0.5 + l * 1.8, (Math.random() - 0.5) * 1.0); f.castShadow = f.receiveShadow = true; g.add(f); } g.position.set(x, 0, z); return g; }
    for (let i = 0; i < 60; i++) { const z = i * 10; trees.push(mkTree(-10.5 - Math.random() * 9, z)); trees.push(mkTree(10.5 + Math.random() * 9, z)); scene.add(trees[trees.length - 2]); scene.add(trees[trees.length - 1]); }

    const bushes = [];
    for (let i = 0; i < 70; i++) { const g = new THREE.Group(); for (let c = 0; c < 3 + Math.floor(Math.random() * 4); c++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.45 + Math.random() * 1.0, 6, 5), new THREE.MeshStandardMaterial({ color: 0x3d6b3d, roughness: 0.7 })); b.position.set((Math.random() - 0.5) * 1.6, 0.35 + Math.random() * 0.55, (Math.random() - 0.5) * 1.6); b.scale.set(1, 0.45 + Math.random() * 0.55, 1); b.castShadow = b.receiveShadow = true; g.add(b); } g.position.set(-8.8 - Math.random() * 6, 0, i * 8.5); bushes.push(g); scene.add(g); const g2 = g.clone(); g2.position.x = 8.8 + Math.random() * 6; bushes.push(g2); scene.add(g2); }

    const smokePs = [], smokeGeo = new THREE.BufferGeometry(), smokeMat = new THREE.PointsMaterial({ color: 0xcccccc, size: 0.35, transparent: true, opacity: 0.5, depthWrite: false });
    scene.add(new THREE.Points(smokeGeo, smokeMat));
    function emitSmoke(x, y, z, int) { for (let i = 0; i < Math.floor(int * 3.5); i++) smokePs.push({ pos: new THREE.Vector3(x + (Math.random() - 0.5) * 2.8, y + Math.random() * 0.6, z + (Math.random() - 0.5) * 1.8), vel: new THREE.Vector3((Math.random() - 0.5) * 0.35, 0.02 + Math.random() * 0.07, (Math.random() - 0.5) * 0.35), life: 1, decay: 0.018 + Math.random() * 0.04 }); }
    function updateSmoke() { for (let i = smokePs.length - 1; i >= 0; i--) { const p = smokePs[i]; p.life -= p.decay; p.pos.add(p.vel); if (p.life <= 0) smokePs.splice(i, 1); } const a = new Float32Array(smokePs.length * 3); for (let i = 0; i < smokePs.length; i++) { a[i * 3] = smokePs[i].pos.x; a[i * 3 + 1] = smokePs[i].pos.y; a[i * 3 + 2] = smokePs[i].pos.z; } smokeGeo.setAttribute('position', new THREE.BufferAttribute(a, 3)); }

    const tireMarks = [];
    function addTireMark(x, z) { const g = new THREE.PlaneGeometry(0.35, 0.7); const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x1a1a1a, transparent: true, opacity: 0.75, depthWrite: false, side: THREE.DoubleSide })); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.04, z); scene.add(m); tireMarks.push(m); if (tireMarks.length > 250) { const old = tireMarks.shift(); scene.remove(old); old.geometry.dispose(); old.material.dispose(); } }

    const player = { x: 0, spd: 0, min: 0, max: 2.0, hb: false, drift: false, gear: 0, prevGear: 0, wheelAngle: 0, gearStable: 0 };
    const dashAnim = { displaySpeed: 0, targetSpeed: 0, gearShiftTimer: 0, gearShiftAmount: 0 };
    let score = 0, go = false, fc = 0;
    const cars = [], rw = 16, lw = rw / 3;
    let pCar, wheels = [], brakeLights = [];
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Space: false };
    const scEl = document.getElementById('score'), gearEl = document.getElementById('gear'), hbEl = document.getElementById('handbrake-indicator'), drEl = document.getElementById('drift-indicator'), gp = document.getElementById('gameover-panel'), fsEl = document.getElementById('final-score');
    const spCv = document.getElementById('speedCanvas'), ctx = spCv.getContext('2d');

    const gearUpThresholds = [0, 0.38, 0.70, 1.05, 1.45, 1.85];
    const gearDownThresholds = [0, 0.05, 0.32, 0.62, 0.97, 1.37];

    function getGear(spd) {
      if (player.gear < 5 && spd >= gearUpThresholds[player.gear + 1]) return player.gear + 1;
      if (player.gear > 0 && spd < gearDownThresholds[player.gear]) return player.gear - 1;
      return player.gear;
    }
    const gearNames = ['N', '1', '2', '3', '4', '5'];

    function mkPCar() {
      const g = new THREE.Group();
      const b = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.75, 4.2), new THREE.MeshStandardMaterial({ color: 0x33aaff, roughness: 0.12, metalness: 0.9 })); b.position.y = 0.65; b.castShadow = b.receiveShadow = true; g.add(b);
      const w = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.65, 2.1), new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.08, emissive: new THREE.Color(0x000822) })); w.position.set(0, 1.12, -0.08); w.castShadow = w.receiveShadow = true; g.add(w);
      const r = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.32, 1.8), new THREE.MeshStandardMaterial({ color: 0x3388cc, roughness: 0.3 })); r.position.set(0, 1.48, 0.02); r.castShadow = r.receiveShadow = true; g.add(r);
      const tireGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.75, 24);
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
      const rimGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.76, 8);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2, metalness: 0.95 });
      const wheelPositions = [[-1.1, 0.45, 1.55], [1.1, 0.45, 1.55], [-1.1, 0.45, -1.55], [1.1, 0.45, -1.55]];
      wheels = [];
      wheelPositions.forEach(pos => {
        const whGrp = new THREE.Group();
        const tire = new THREE.Mesh(tireGeo, tireMat); tire.rotation.z = Math.PI / 2; tire.castShadow = tire.receiveShadow = true; whGrp.add(tire);
        const rim = new THREE.Mesh(rimGeo, rimMat); rim.rotation.z = Math.PI / 2; rim.castShadow = rim.receiveShadow = true; whGrp.add(rim);
        whGrp.position.set(pos[0], pos[1], pos[2]); whGrp.userData = { x: pos[0], z: pos[2] }; g.add(whGrp); wheels.push(whGrp);
      });
      const lg = new THREE.SphereGeometry(0.32, 8, 8), lm = new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: new THREE.Color(0xffaa00) });
      [[-0.95, 0.7, 2.15], [0.95, 0.7, 2.15]].forEach(p => { const l = new THREE.Mesh(lg, lm); l.position.set(p[0], p[1], p[2]); g.add(l); });
      brakeLights = [];
      const tlGeo = new THREE.SphereGeometry(0.22, 6, 6);
      const tlMatOff = new THREE.MeshStandardMaterial({ color: 0x440000, roughness: 0.5 });
      [[-0.95, 0.55, -2.1], [0.95, 0.55, -2.1]].forEach(p => { const l = new THREE.Mesh(tlGeo, tlMatOff.clone()); l.position.set(p[0], p[1], p[2]); g.add(l); brakeLights.push(l); });
      return g;
    }
    pCar = mkPCar(); pCar.position.set(0, 0.35, 10); pCar.castShadow = pCar.receiveShadow = true; scene.add(pCar);

    function mkECar(c = 0xff5555, flipped = false) {
      const g = new THREE.Group();
      const b = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.75, 3.8), new THREE.MeshStandardMaterial({ color: c, roughness: 0.28, metalness: 0.6 })); b.position.y = 0.65; b.castShadow = b.receiveShadow = true; g.add(b);
      const w = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 1.9), new THREE.MeshStandardMaterial({ color: 0x222244, roughness: 0.15 })); w.position.set(0, 1.08, 0); w.castShadow = w.receiveShadow = true; g.add(w);
      const tireGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.7, 16); const tireMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.7 });
      [[-1.05, 0.42, 1.45], [1.05, 0.42, 1.45], [-1.05, 0.42, -1.45], [1.05, 0.42, -1.45]].forEach(p => { const wh = new THREE.Mesh(tireGeo, tireMat); wh.rotation.z = Math.PI / 2; wh.position.set(p[0], p[1], p[2]); wh.castShadow = wh.receiveShadow = true; g.add(wh); });
      const tlGeo = new THREE.SphereGeometry(0.18, 6, 6); const tlMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: new THREE.Color(0x330000) });
      [[-0.9, 0.5, -1.9], [0.9, 0.5, -1.9]].forEach(p => { const l = new THREE.Mesh(tlGeo, tlMat); l.position.set(p[0], p[1], p[2]); g.add(l); });
      const hlGeo = new THREE.SphereGeometry(0.18, 6, 6); const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: new THREE.Color(0x332200) });
      [[-0.9, 0.5, 1.9], [0.9, 0.5, 1.9]].forEach(p => { const l = new THREE.Mesh(hlGeo, hlMat); l.position.set(p[0], p[1], p[2]); g.add(l); });
      if (flipped) { g.rotation.y = Math.PI; }
      return g;
    }

    function drawDb(speedKmh) {
      const w = 220, h = 220, cx = 110, cy = 110, r = 85;
      ctx.clearRect(0, 0, w, h);
      ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(20,20,30,0.85)'; ctx.fill(); ctx.strokeStyle = '#666'; ctx.lineWidth = 5; ctx.stroke();
      for (let i = 0; i <= 10; i++) { const a = (i / 10) * 270 - 135, rad = a * Math.PI / 180; ctx.beginPath(); ctx.moveTo(cx + Math.cos(rad) * (r - 15), cy + Math.sin(rad) * (r - 15)); ctx.lineTo(cx + Math.cos(rad) * (r - 3), cy + Math.sin(rad) * (r - 3)); ctx.strokeStyle = i < 2 ? '#ff5555' : '#ddd'; ctx.lineWidth = 2.5; ctx.stroke(); }
      let displaySpeed = dashAnim.displaySpeed;
      if (dashAnim.gearShiftTimer > 0) { const shiftProgress = dashAnim.gearShiftTimer / 20; const pullback = Math.sin(shiftProgress * Math.PI) * dashAnim.gearShiftAmount; displaySpeed = Math.max(0, displaySpeed - pullback); }
      const sp = Math.min(displaySpeed, 220) / 220; const pa = (sp * 270 - 135) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(pa) * (r - 22), cy + Math.sin(pa) * (r - 22)); ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 5; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.font = 'bold 22px "Segoe UI"'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(`${Math.floor(displaySpeed)}`, cx, cy + 35);
      ctx.font = '12px "Segoe UI"'; ctx.fillText('km/h', cx, cy + 52);
    }

    function spawnE() { const c = mkECar(0xff4444, true); c.position.set((Math.floor(Math.random() * 3) - 1) * lw, 0.35, 200); c.userData = { spd: 0.25 + Math.random() * 0.45, flipped: true }; scene.add(c); cars.push(c); }

    function reset() {
      cars.forEach(c => scene.remove(c)); cars.length = 0;
      player.x = 0; pCar.position.x = 0; pCar.rotation.set(0, 0, 0); player.spd = 0; player.hb = false; player.drift = false; player.gear = 0; player.prevGear = 0; player.wheelAngle = 0; player.gearStable = 0;
      wheels.forEach(w => w.rotation.x = 0);
      brakeLights.forEach(l => { l.material.color.setHex(0x440000); l.material.emissive.setHex(0x000000); });
      smokePs.length = 0; tireMarks.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }); tireMarks.length = 0;
      dashAnim.displaySpeed = 0; dashAnim.targetSpeed = 0; dashAnim.gearShiftTimer = 0; dashAnim.gearShiftAmount = 0;
      gearEl.classList.remove('gear-shift'); hbEl.style.display = 'none'; drEl.style.display = 'none';
      score = 0; go = false; gp.style.display = 'none'; updateUI();
      roadLines.forEach((o, i) => o.position.z = (i % 60) * 10); trees.forEach((o, i) => { if (o) o.position.z = (i % 60) * 10; }); bushes.forEach((o, i) => { if (o) o.position.z = (i % 70) * 8.5; });
    }

    function updateUI() {
      scEl.innerHTML = `🏆 ${Math.floor(score)}`; gearEl.innerHTML = `⚙️ ${gearNames[player.gear]} 挡`;
      hbEl.style.display = player.hb ? 'block' : 'none'; drEl.style.display = player.drift ? 'block' : 'none';
      dashAnim.targetSpeed = Math.floor(player.spd * 100);
      if (dashAnim.gearShiftTimer > 0) { dashAnim.gearShiftTimer--; if (dashAnim.gearShiftTimer === 0) gearEl.classList.remove('gear-shift'); }
      dashAnim.displaySpeed += (dashAnim.targetSpeed - dashAnim.displaySpeed) * 0.3;
      if (Math.abs(dashAnim.displaySpeed - dashAnim.targetSpeed) < 0.1) dashAnim.displaySpeed = dashAnim.targetSpeed;
      drawDb(Math.floor(dashAnim.displaySpeed));
    }

    let tireMarkTimer = 0;
    function input() {
      let md = 0;
      if (keys.ArrowLeft) md = 1;
      if (keys.ArrowRight) md = -1;
      player.drift = player.spd > 0.35 && md !== 0 && keys.Space;
      if (md !== 0) { player.x += md * (player.drift ? 0.18 : 0.32); player.x = Math.max(-7.0, Math.min(7.0, player.x)); pCar.position.x = player.x; }
      if (player.drift && player.spd > 0.3) {
        [[-1.1, 0.35, -1.55], [1.1, 0.35, -1.55]].forEach(p => { const wp = new THREE.Vector3(p[0], p[1], p[2]); pCar.localToWorld(wp); emitSmoke(wp.x, wp.y, wp.z, player.spd * 2.2); });
        tireMarkTimer++; if (tireMarkTimer >= 2) { tireMarkTimer = 0; [[-1.1, -1.55], [1.1, -1.55]].forEach(([lx, lz]) => { const wp = new THREE.Vector3(lx, 0, lz); pCar.localToWorld(wp); addTireMark(wp.x, wp.z); }); }
      }
      const isBraking = keys.ArrowDown || keys.Space;
      if (keys.Space) { player.hb = true; player.spd = Math.max(player.min, player.spd - (player.drift ? 0.003 : 0.008)); }
      else { player.hb = false; if (keys.ArrowUp) { const sr = player.spd / player.max; player.spd = Math.min(player.max, player.spd + Math.max(0.001, 0.012 * (1 - Math.pow(sr, 3)))); } else if (keys.ArrowDown) player.spd = Math.max(player.min, player.spd - 0.015); else player.spd = Math.max(player.min, player.spd - 0.002); }
      const newGear = getGear(player.spd);
      if (newGear !== player.gear) { player.gearStable++; if (player.gearStable > 3) { player.prevGear = player.gear; player.gear = newGear; player.gearStable = 0; dashAnim.gearShiftTimer = 20; dashAnim.gearShiftAmount = 15 + Math.random() * 10; gearEl.classList.add('gear-shift'); if (newGear > player.prevGear && player.prevGear > 0) player.spd = Math.max(0, player.spd - 0.02); } }
      else player.gearStable = 0;
      brakeLights.forEach(l => { l.material.color.setHex(isBraking ? 0xff0000 : 0x440000); l.material.emissive.setHex(isBraking ? 0xff0000 : 0x000000); });
      wheels.forEach(w => { w.rotation.x += player.spd * 8; });
      updateSound(player.spd, player.drift);
    }

    function loop() {
      if (!go) { fc++; input();
        roadLines.forEach(o => { o.position.z -= player.spd; if (o.position.z < -5) o.position.z += 600; });
        trees.forEach(o => { if (o) { o.position.z -= player.spd; if (o.position.z < -40) o.position.z += 600; } });
        bushes.forEach(o => { if (o) { o.position.z -= player.spd; if (o.position.z < -40) o.position.z += 600; } });
        tireMarks.forEach(m => { m.position.z -= player.spd; });
        for (let i = tireMarks.length - 1; i >= 0; i--) { if (tireMarks[i].position.z < -25) { const m = tireMarks[i]; scene.remove(m); m.geometry.dispose(); m.material.dispose(); tireMarks.splice(i, 1); } }
        if (fc % 120 === 0) spawnE();
        for (let i = cars.length - 1; i >= 0; i--) { const c = cars[i]; c.position.z -= player.spd; c.position.z -= c.userData.spd; if (c.position.z < -25 || c.position.z > 250) { scene.remove(c); cars.splice(i, 1); } }
        updateSmoke();
        if (cars.some(c => new THREE.Box3().setFromObject(pCar).expandByScalar(-0.4).intersectsBox(new THREE.Box3().setFromObject(c).expandByScalar(-0.35)))) { go = true; fsEl.textContent = Math.floor(score); gp.style.display = 'block'; updateSound(0, false); }
        score += player.spd * 1.2; updateUI();
        const co = new THREE.Vector3(0, 9.0, -14), pp = pCar.position.clone(); camera.position.copy(pp.clone().add(co)); camera.lookAt(pp.clone().add(new THREE.Vector3(0, 2.8, 8)));
      }
      renderer.render(scene, camera); labelR.render(scene, camera); requestAnimationFrame(loop);
    }

    // ★ 键盘事件
    window.addEventListener('keydown', e => { if (e.code in keys) { keys[e.code] = true; e.preventDefault(); if (!audioOn) initAudio(); } if (e.code === 'Space') e.preventDefault(); });
    window.addEventListener('keyup', e => { if (e.code in keys) { keys[e.code] = false; e.preventDefault(); } if (e.code === 'Space') e.preventDefault(); });

    // ★ 手机触控按钮事件
    function setupMobileButton(id, keyCode, action) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (!audioOn) initAudio();
        if (action === 'key') keys[keyCode] = true;
        else if (action === 'space') keys.Space = true;
      });
      btn.addEventListener('pointerup', (e) => {
        e.preventDefault();
        if (action === 'key') keys[keyCode] = false;
        else if (action === 'space') keys.Space = false;
      });
      btn.addEventListener('pointerleave', (e) => {
        if (action === 'key') keys[keyCode] = false;
        else if (action === 'space') keys.Space = false;
      });
      btn.addEventListener('pointercancel', (e) => {
        if (action === 'key') keys[keyCode] = false;
        else if (action === 'space') keys.Space = false;
      });
    }

    setupMobileButton('btn-gas', 'ArrowUp', 'key');
    setupMobileButton('btn-brake', 'ArrowDown', 'key');
    setupMobileButton('btn-left', 'ArrowLeft', 'key');
    setupMobileButton('btn-right', 'ArrowRight', 'key');
    setupMobileButton('btn-handbrake', null, 'space');

    // 游戏结束按钮
    document.getElementById('restart-btn').addEventListener('click', reset);
    document.getElementById('restart-btn').addEventListener('touchend', (e) => { e.preventDefault(); reset(); });

    window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });
    reset(); loop();
  </script>
</body>
</html>
